services:
  postgres:
    image: postgres:16-alpine
    container_name: sqlpractice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqlpractice
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlpractice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: sqlpractice_pgdata
